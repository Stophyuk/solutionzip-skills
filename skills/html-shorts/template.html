<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>html-shorts template</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* One short = one HTML file at 1080×1920. Scenes switch by data-start/data-end (seconds).
     Animations always run from the start of the video: animation-delay is "seconds from 0", not from the scene.
     Do not start animations from [data-on] — the renderer pauses every animation and sets it to t. */
  :root {
    --bg: #FFE14D; --ink: #111111; --mute: #4A463E; --dark: #111111; --dark-ink: #FFE14D;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); word-break: keep-all; }
  main { position: relative; width: 1080px; height: 1920px; }

  /* Safe area: platform buttons sit on the right and the caption at the bottom. Keep text inside
     x 80–960, y 260–1540 (the renderer warns when text leaves it). */
  .scene { position: absolute; inset: 0; padding: 300px 120px 380px 80px; display: flex; flex-direction: column; justify-content: center; gap: 28px; visibility: hidden; }
  .scene[data-on] { visibility: visible; }
  .dark { background: var(--dark); color: var(--dark-ink); }

  .label { font-size: 44px; font-weight: 700; color: var(--mute); }
  .big { font-size: 128px; font-weight: 800; line-height: 1.2; letter-spacing: -0.03em; }
  .big mark { background: var(--ink); color: var(--bg); padding: 0 16px; }
  .mid { font-size: 64px; font-weight: 700; line-height: 1.35; }
  .small { font-size: 44px; font-weight: 600; color: var(--mute); }
  .code { font: 500 44px/1.6 ui-monospace, "SF Mono", Menlo, monospace; background: #111; color: #F3EFE6; border-radius: 24px; padding: 36px 40px; }
  .code .type { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; }
  .step { display: flex; gap: 28px; align-items: baseline; font-size: 68px; font-weight: 800; }
  .step b { font-size: 56px; width: 80px; flex: none; }
  .url { font-size: 56px; font-weight: 800; line-height: 1.3; color: #fff; }
  .dark .small { color: #E9E4D8; }

  /* progress bar — one animation across the whole video */
  .bar { position: absolute; left: 0; top: 0; height: 14px; width: 100%; background: var(--ink); transform-origin: left; animation: grow 13s linear both; z-index: 5; }

  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 70% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes type { from { max-width: 0; } to { max-width: 100%; } }
  .rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .pop { animation: pop .5s ease-out both; }
</style>
</head>
<body>
<main data-duration="13" data-cover="1.2">
  <div class="bar"></div>

  <!-- 0–3s · the hook: a question someone answers in their head -->
  <section class="scene" data-start="0" data-end="3">
    <div class="label rise" style="animation-delay:0s">클로드 스킬</div>
    <div class="big">
      <div class="rise" style="animation-delay:0s">카드뉴스,</div>
      <div class="rise" style="animation-delay:.15s">아직 <mark>디자인 툴</mark>로</div>
      <div class="rise" style="animation-delay:.3s">만드세요?</div>
    </div>
  </section>

  <!-- 3–6.4s · the turn -->
  <section class="scene" data-start="3" data-end="6.4">
    <div class="big"><div class="pop" style="animation-delay:3.05s">HTML 한 장이면</div><div class="pop" style="animation-delay:3.3s">돼요</div></div>
    <div class="code rise" style="animation-delay:3.7s">
      <div><span class="type" style="animation: type .9s steps(28) 3.9s both">&lt;section data-card="표지"&gt;</span></div>
      <div><span class="type" style="animation: type .9s steps(22) 4.8s both">&nbsp;&nbsp;한 장에 한 메시지</span></div>
      <div><span class="type" style="animation: type .5s steps(10) 5.6s both">&lt;/section&gt;</span></div>
    </div>
  </section>

  <!-- 6.4–10.2s · what it does, one line at a time -->
  <section class="scene" data-start="6.4" data-end="10.2">
    <div class="label rise" style="animation-delay:6.45s">이렇게 해요</div>
    <div class="step rise" style="animation-delay:6.6s"><b>1</b><span>한 장에 한 메시지</span></div>
    <div class="step rise" style="animation-delay:7.5s"><b>2</b><span>카드마다 PNG로 찍기</span></div>
    <div class="step rise" style="animation-delay:8.4s"><b>3</b><span>넘침 · 잘림 자동 검사</span></div>
  </section>

  <!-- 10.2–13s · one action -->
  <section class="scene dark" data-start="10.2" data-end="13">
    <div class="big"><div class="rise" style="animation-delay:10.25s">파일은</div><div class="rise" style="animation-delay:10.45s">깃허브에</div></div>
    <div class="url rise" style="animation-delay:10.9s">github.com/Stophyuk/<br>solutionzip-skills</div>
    <div class="small rise" style="animation-delay:11.3s">@solution.zip · 우리가 쓰는 파일 그대로</div>
  </section>
</main>
</body>
</html>
