# apps.conf — one line per app on this box. Read (never sourced) by bin/dc, env-merge.sh, cron-call.sh, backup.sh.
# Columns:
#   name        compose project, /srv/<name>, container prefix (<name>-db-1), image <name>/app. Lowercase, no dots.
#   deploy-dir  where docker-compose.yml and env.fixed live inside the app's repo (a monorepo might use web/deploy)
#   port        the host port the app publishes on 127.0.0.1 — host cron calls it there. One per app.
#
# name    deploy-dir    port
app1      deploy        3010
#app2     web/deploy    3020
