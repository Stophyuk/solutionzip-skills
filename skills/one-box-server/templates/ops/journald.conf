# /etc/systemd/journald.conf.d/retention.conf — installed by ops/prep.sh
# The system journal, cron-call logs and any container that logs to journald (GoTrue, for one, logs client IPs).
# Files roll daily and entries older than 30 days are deleted, matching the privacy policy.
# (MaxRetentionSec deletes whole files, so without the daily roll an entry could live up to about twice as long.)
[Journal]
MaxFileSec=1day
MaxRetentionSec=30day
