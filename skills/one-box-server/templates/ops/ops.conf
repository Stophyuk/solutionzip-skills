# ops.conf — box-wide settings, sourced by prep.sh, backup.sh and restore-drill.sh. Not secret: the mail key lives in
# /srv/ops/alert.env and the bucket key in root's aws profile, both outside this repo.
# (Root scripts already run code from this repo, so sourcing a file from it adds no new trust.)

# Host time zone. cron.d files are written in this zone — Ubuntu's cron ignores CRON_TZ.
HOST_TZ=Asia/Seoul
# The login user that owns /srv and deploys (Ubuntu cloud images: ubuntu).
OPS_USER=ubuntu
# Private S3-compatible bucket for the nightly backups, and root's aws CLI profile that may write it (and nothing else).
BACKUP_BUCKET=s3://your-backup-bucket
BACKUP_AWS_PROFILE=backup
# Endpoint URL for S3-compatible stores other than AWS (R2, B2, MinIO …). Empty for AWS itself.
BACKUP_ENDPOINT=
